name: Serv00 SSH login
on:
  schedule:
    - cron: '0 15 */8 * *'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Validate reviewed commit
        env:
          REVIEWED_COMMIT: ${{ vars.SERV00_REVIEWED_COMMIT }}
        run: '[[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ vars.SERV00_REVIEWED_COMMIT }}
      - run: sudo apt-get install -y sshpass jq
      - name: Run verified SSH connections
        env:
          ACCOUNTS: ${{ secrets.SERV00_ACCOUNTS }}
          KNOWN_HOSTS: ${{ secrets.SERV00_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SERV00_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          export SSH_KNOWN_HOSTS_FILE="$RUNNER_TEMP/serv00_known_hosts"
          printf '%s\n' "$KNOWN_HOSTS" > "$SSH_KNOWN_HOSTS_FILE"
          if [[ -n "$SSH_PRIVATE_KEY" ]]; then
            eval "$(ssh-agent -s)" >/dev/null
            trap 'ssh-agent -k >/dev/null' EXIT
            trap 'exit 1' HUP INT TERM
            ssh-add - <<< "$SSH_PRIVATE_KEY" >/dev/null 2>&1
          fi
          bash kp.sh --login
