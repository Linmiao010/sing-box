name: Serv00 HTTPS health
on:
  workflow_dispatch:

permissions: {}
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check health
        env:
          HEALTH_URLS: ${{ secrets.HEALTH_URLS }}
        run: |
          python3 - <<'PY'
          import os, sys, urllib.parse, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None
          urls = os.environ["HEALTH_URLS"].split()
          client = urllib.request.build_opener(NoRedirect)
          failed = not urls
          for i, raw in enumerate(urls, 1):
              try:
                  url = urllib.parse.urlsplit(raw)
                  if url.scheme != "https" or url.path != "/health" or url.username or url.password or url.query or url.fragment:
                      raise ValueError()
                  with client.open(raw, timeout=15) as response:
                      if response.status != 200 or response.read(4) != b"ok\n":
                          raise ValueError()
                  print(f"health {i} ok")
              except Exception:
                  print(f"health {i} failed")
                  failed = True
          sys.exit(failed)
          PY
